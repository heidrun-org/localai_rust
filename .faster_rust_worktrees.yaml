baseRef: HEAD
worktreeDirectory: .agents/worktrees
targetDirectories:
  - target
installCommand:
  cwd: .
  argv:
    - pnpm
    - install
    - --frozen-lockfile
cargoCommands:
  - cwd: packages/localai_embeddings
    argv:
      - cargo
      - build
  - cwd: packages/localai_embeddings
    argv:
      - cargo
      - build
      - --release
  - cwd: packages/localai_embeddings
    argv:
      - cargo
      - test
      - --no-run
  - cwd: packages/localai_decisions
    argv:
      - cargo
      - build
      - --release
  - cwd: packages/localai_decisions
    argv:
      - cargo
      - test
      - --release
      - --no-run
  - cwd: packages/localai_llm
    argv:
      - cargo
      - build
      - --release
  - cwd: packages/localai_llm
    argv:
      - cargo
      - test
      - --release
      - --no-run
  - cwd: packages/localai_vector_store
    argv:
      - cargo
      - build
      - --locked
      - --release
  - cwd: packages/localai_vector_store
    argv:
      - cargo
      - test
      - --locked
      - --no-run
